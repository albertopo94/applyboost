_format_version: "1.1"

services:
  - name: auth
    url: http://auth:9999
    routes:
      - name: auth-route
        paths:
          - /auth/v1

  - name: rest
    url: http://rest:3000
    routes:
      - name: rest-route
        paths:
          - /rest/v1

  - name: storage
    url: http://storage:8080
    routes:
      - name: storage-route
        paths:
          - /storage/v1

  - name: realtime
    url: http://realtime:4000
    routes:
      - name: realtime-route
        paths:
          - /realtime/v1

  - name: meta
    url: http://meta:8080
    routes:
      - name: meta-route
        paths:
          - /pg_meta/v1

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PATCH
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Content-Type
        - Authorization
        - apikey
        - X-Client-Info
      exposed_headers:
        - Content-Range
        - X-Total-Count
      max_age: 3600
      credentials: true
